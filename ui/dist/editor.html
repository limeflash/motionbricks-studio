<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pose editor</title>
    <style>
:root { color-scheme: dark; --bg: #121216; --panel: #1b1b21; --line: #2e2e36; --fg: #ececf1; --fg2: #a3a3ad; --acc: #ff6a3d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
header .hint { color: var(--fg2); font-size: 12px; flex-basis: 100%; }
#clip { color: var(--fg2); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
#view { height: 62vh; min-height: 320px; position: relative; }
#view canvas { display: block; width: 100%; height: 100%; }
.panel { padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button { background: #26262e; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
button:hover { border-color: #4a4a55; }
button[aria-pressed="true"] { background: #3a3a46; border-color: #5a5a68; }
button.primary { background: var(--acc); border-color: var(--acc); color: #1a0d07; font-weight: 600; }
button:disabled { opacity: 0.5; cursor: default; }
.kc { display: inline-flex; }
.kc .eye { border-radius: 8px 0 0 8px; border-right: 0; padding: 5px 7px; color: var(--fg2); }
.kc .key { border-radius: 0 8px 8px 0; }
.key.hidden { color: var(--fg2); }
.key.edited::after { content: " •"; color: var(--acc); }
.seg { display: inline-flex; gap: 2px; }
.muted { color: var(--fg2); font-size: 12px; }
.err { color: #ff8a7a; }
#result iframe { width: 100%; height: 1100px; border: 0; display: block; }
#result .links { padding: 8px 16px; }
#result a { color: var(--acc); }

    </style>
  </head>
  <body>
    <header>
      <b>Pose editor</b> <span id="clip"></span>
      <span class="hint">Click a pose to pick it (Ctrl-click to pick several). Drag the orange handles (hands, feet) and
        the yellow one (hips) like IK controls; click a white dot to turn that joint. G move · R turn · Ctrl+Z undo ·
        H hide · O only the picked · A all · F frame</span>
    </header>
    <div id="view"></div>
    <section class="panel">
      <div class="row"><span id="keys" class="row"></span>
        <button id="only">Only the picked (O)</button><button id="all">Show all (A)</button><button id="frame">Frame (F)</button></div>
      <div class="row">
        <div class="seg"><button id="move">Move (G)</button><button id="turn">Turn (R)</button></div>
        <button id="undo">Undo</button>
        <button id="reset">Reset this key</button>
        <span id="sel" class="muted"></span>
      </div>
      <div class="row">
        <button id="block" class="primary">Blocking on the freak</button>
        <button id="kimodo">Kimodo</button>
        <label class="muted"><input type="checkbox" id="gpuok" /> Roblox isn't in Play and no Blender render runs
          (skip the GPU check)</label>
        <span id="status" class="muted"></span>
      </div>
    </section>
    <section id="result"></section>
